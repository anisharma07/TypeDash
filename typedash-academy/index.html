<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>TypeDash Academy</title>
  <meta name="description" content="TypeDash Academy: an offline touch-typing course. 12 chapters, 76 episodes, adaptive weak-key drills, guides, speed tests and progress saved on your device." />
  <meta name="theme-color" content="#070914" />
  <link rel="icon" href="assets/favicon.svg" type="image/svg+xml" />
  <link rel="manifest" href="manifest.webmanifest" />
  <script>
    /* Apply the saved theme before first paint (avoids a flash). */
    (function () {
      try {
        var idx = JSON.parse(localStorage.getItem('tda:index') || 'null');
        var p = idx && idx.active ? JSON.parse(localStorage.getItem('tda:profile:' + idx.active) || 'null') : null;
        var s = (p && p.settings) || {};
        var t = s.theme === 'light' ? 'light' : s.theme === 'system' && window.matchMedia && matchMedia('(prefers-color-scheme: light)').matches ? 'light' : 'dark';
        document.documentElement.setAttribute('data-theme', t);
        document.documentElement.setAttribute('data-size', s.fontSize || 'm');
      } catch (e) { /* storage blocked: defaults apply */ }
    })();
  </script>
  <link rel="stylesheet" href="css/tokens.css" />
  <link rel="stylesheet" href="css/base.css" />
  <link rel="stylesheet" href="css/player.css" />
  <link rel="stylesheet" href="css/pages.css" />
</head>
<body>
  <a class="skip-link btn btn-primary" href="#app">Skip to content</a>
  <header class="app-nav" id="nav"></header>
  <main id="app" tabindex="-1"></main>
  <footer class="app-foot">
    <span>TypeDash Academy · offline edition · &copy; <span id="year"></span> TypeDash</span>
    <span>Progress is saved in this browser. Export a backup from Settings.</span>
  </footer>
  <noscript><div class="page"><div class="card"><h1>TypeDash Academy needs JavaScript</h1><p>Please enable JavaScript to use the typing course.</p></div></div></noscript>

  <!-- core -->
  <script defer src="js/core/util.js"></script>
  <script defer src="js/core/keyboard.js"></script>
  <script defer src="js/core/storage.js"></script>
  <!-- content -->
  <script defer src="js/data/words.js"></script>
  <script defer src="js/data/texts.js"></script>
  <script defer src="js/data/guides.js"></script>
  <script defer src="js/data/curriculum.js"></script>
  <!-- engine -->
  <script defer src="js/core/generator.js"></script>
  <script defer src="js/core/engine.js"></script>
  <script defer src="js/core/stats.js"></script>
  <script defer src="js/core/sound.js"></script>
  <script defer src="js/core/course.js"></script>
  <script defer src="js/core/plans.js"></script>
  <script defer src="js/core/achievements.js"></script>
  <!-- ui -->
  <script defer src="js/ui/components/icons.js"></script>
  <script defer src="js/ui/components/ui.js"></script>
  <script defer src="js/ui/components/charts.js"></script>
  <script defer src="js/ui/components/keyboard-view.js"></script>
  <script defer src="js/ui/components/typing-view.js"></script>
  <script defer src="js/ui/router.js"></script>
  <script defer src="js/ui/pages/player.js"></script>
  <script defer src="js/ui/pages/home.js"></script>
  <script defer src="js/ui/pages/learn.js"></script>
  <script defer src="js/ui/pages/practice.js"></script>
  <script defer src="js/ui/pages/challenges.js"></script>
  <script defer src="js/ui/pages/stats.js"></script>
  <script defer src="js/ui/pages/settings.js"></script>
  <script defer src="js/app.js"></script>
</body>
</html>
