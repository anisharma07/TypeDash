version: "3"

services:
  # Main application service (for cloud/Atlas database)
  app:
    build: .
    ports:
      - "0.0.0.0:2360:2360"
    environment:
      # Use environment variable with fallback to local mongo
      - MONGODB_URI=${MONGODB_URI:-mongodb://mongo:27017/TypeDash}
    volumes:
      # Bind-mount the source for live server edits, but shadow build outputs
      # with anonymous volumes so the mount does not hide what the image built:
      # node_modules (installed in the image) and client/dist (the React build).
      - ./:/usr/src/app
      - /usr/src/app/node_modules
      - /usr/src/app/client/dist
    restart: unless-stopped
    profiles:
      - atlas

  # Application with local database dependency
  app-local:
    build: .
    ports:
      - "0.0.0.0:2360:2360"
    environment:
      - MONGODB_URI=${MONGODB_URI:-mongodb://mongo:27017/TypeDash}
    depends_on:
      - mongo
    volumes:
      # Bind-mount the source for live server edits, but shadow build outputs
      # with anonymous volumes so the mount does not hide what the image built:
      # node_modules (installed in the image) and client/dist (the React build).
      - ./:/usr/src/app
      - /usr/src/app/node_modules
      - /usr/src/app/client/dist
    restart: unless-stopped
    profiles:
      - local-db

  # Local MongoDB service
  mongo:
    image: mongo:latest
    ports:
      - "0.0.0.0:2701:27017"
    volumes:
      - mongo-data:/data/db
    restart: unless-stopped
    profiles:
      - local-db

volumes:
  mongo-data:
    driver: local
